[config]
schemaVersion = "0.0.1"

[package]
namespace = "gogas1"
name = "TalismanSwitch"
versionNumber = "1.0.1"
description = "Talisman switching mod"
websiteUrl = "https://github.com/Gogas1/TalismanSwitch"
containsNsfwContent = false

[package.dependencies]
"BepInEx-BepInExPack" = "5.4.2100"
"ninesolsmodding-NineSolsAPI" = "0.0.2"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "build/dll"
target = "."

[publish]
repository = "https://thunderstore.io"
communities = [ "nine-sols" ]
